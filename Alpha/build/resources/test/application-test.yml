# 테스트 프로파일 — Testcontainers MariaDB 사용
# DataSource URL은 IntegrationTestBase.ContainerInitializer가 런타임에 동적 주입
# 여기서는 다른 공통 설정만

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # seed.sql은 IntegrationTestBase.cleanData()가 매 테스트마다 재실행하므로 자동 실행 제외
      data-locations: classpath:db/seed.sql
      continue-on-error: false

logging:
  level:
    root: WARN
    com.example.docver: INFO
    org.springframework.jdbc.core: WARN
    org.testcontainers: INFO

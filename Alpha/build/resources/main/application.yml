# 알파 테스트 시연용 설정
# - 메모리에 기록된 환경: MariaDB 10.11 LTS + Docker
# - 시연 환경 시작 명령: docker-compose up -d (별도 제공)

spring:
  application:
    name: document-version-demo

  datasource:
    url: jdbc:mariadb://localhost:3306/docver?useUnicode=true&characterEncoding=utf8mb4
    username: docver
    password: docver_pw
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.example.docver: DEBUG
    org.springframework.jdbc.core: DEBUG  # SQL 로깅 (시연 시 토글 가능)

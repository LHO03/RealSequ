// Spring Boot 3.x + Java 17 + JdbcTemplate + MariaDB
// 알파 테스트 시연 버전 - 시나리오 1만 동작
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.1.0-alpha'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // MariaDB driver
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.3'

    // Lombok - boilerplate reduction
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Testcontainers — 실제 MariaDB 컨테이너 기반 통합 테스트
    //   이유: 우리 SQL은 MariaDB 전용 구문 사용 (REPLACE INTO, INSERT IGNORE, 백틱)
    //         H2 인메모리로는 검증 불가
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:mariadb:1.19.7'
}

tasks.named('test') {
    useJUnitPlatform()
    // 05/14 - 테스트는 기본 비활성화 (Docker 의존)
    //   Docker Desktop이 실행 중일 때만 ./gradlew test -PrunTests=true 로 실행
    //   시연 본체(bootRun)는 테스트 없이도 동작
    if (!project.hasProperty('runTests')) {
        enabled = false
    }
}

# ============================================================
# 테스트 전용 설정 (테스트 클래스패스에서만 읽힘 — 운영 기동에는 영향 없음)
#
# 배경 워커 스케줄링을 전 테스트에서 끈다.
#   Spring 테스트 프레임워크는 클래스별 컨텍스트를 캐시에 살려두는데, Testcontainers는
#   클래스가 끝나면 DB 컨테이너를 내린다. 그래서 끝난 클래스의 스케줄러가 사라진 DB를
#   계속 두드리고, 커넥션 타임아웃(30초)을 기다리다 JVM 종료를 지연시켰다.
#   (Surefire is going to kill self fork JVM — 매 실행 30초 낭비 + 로그 오염)
#
#   워커별 시작 지연을 크게 잡는 방식은 테스트마다 챙겨야 해서 누락되기 쉬웠다.
#   여기서 한 번 끄면 새 테스트를 추가해도 따로 신경 쓸 것이 없다.
#
#   워커 동작을 검증하는 테스트는 스케줄러에 기대지 않고 runOnce() 등을 직접 호출한다.
#   (배경 스레드가 테스트 도중 상태를 바꾸지 않아 오히려 결정적이다.)
#
# 이 키는 application.yml에 없다 — 없으면 켜짐(SchedulingConfig의 matchIfMissing)이므로
# 두 파일이 같은 키를 두고 우선순위를 다투는 상황이 생기지 않는다.
# ============================================================
docversion.scheduling.enabled=false

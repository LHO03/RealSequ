# ============================================================
# Testcontainers(docker-java) Docker API 버전 고정
#
# 배경: Docker Engine 29부터 지원 최소 API 버전이 1.41 → 1.44로 올라갔다.
#   Testcontainers 1.x가 내장한 docker-java는 버전 협상에 실패하면 1.32로 떨어지는데,
#   그러면 데몬이 400을 돌려주고 Testcontainers는 이를 "유효한 Docker 환경 없음"으로 보고한다.
#   (docker info / docker compose 는 최신 API를 쓰므로 멀쩡하다 — 증상이 헷갈리는 이유.)
#
# 이 파일은 테스트 클래스패스(src/test/resources)에서만 읽히므로 운영 코드에 영향이 없다.
#
# 후속 과제: Testcontainers는 1.x 라인에 수정본을 내지 않기로 했다(2.x만 대응).
#   즉 이 고정값은 임시 조치이며, Docker가 최소 버전을 1.44보다 더 올리면 다시 깨진다.
#   근본 해결은 Testcontainers 2.x로 올려 버전 협상에 맡기는 것(P2 과제).
# ============================================================
api.version=1.44
